services:
  cooplink-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: ghcr.io/hollow313/cooplink-server:latest
    container_name: cooplink-server
    restart: unless-stopped
    user: "568:568"
    ports:
      - "47510:47510"  # relais TCP (repli CGNAT)
      # Port UDP gaming (coordination, attribution des IDs, traversée NAT et relais)
      - "30024:30024/udp"
      # HTTP interne (reverse proxy https://cooplink.home-lh.ovh -> 30024)
      - "30024:30024/tcp"
      # Port TCP Web (Interface d'administration et monitoring en direct)
      - "30026:30026/tcp"
    environment:
      - PORT_UDP=30024
      - PORT_RELAY=47510
      - PORT_WEB=30026
      - DATA_DIR=/data
      - SERVER_NAME=CoopLink Official Hub #1
      - RUST_LOG=info
    volumes:
      - ./data:/data
