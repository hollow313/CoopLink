services:
  cooplink-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: ghcr.io/hollow313/cooplink-server:latest
    container_name: cooplink-server
    restart: unless-stopped
    user: "568:568"
    ports:
      # Port unique 30024 exposé pour le tunnel UDP et l'admin Web TCP
      - "30024:30024/udp"
      - "30024:30024/tcp"
    environment:
      - PORT_UDP=30024
      - PORT_WEB=30024
      - DATA_DIR=/data
      - SERVER_NAME=CoopLink Official Hub #1
      - RUST_LOG=info
    volumes:
      # Dossier bindé pour persister les configurations et l'historique
      - ./data:/data
