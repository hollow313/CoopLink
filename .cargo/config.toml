# CoopLink — aucune dépendance runtime externe (pas de VC++ Redistributable).
# La CRT est liée statiquement dans les exécutables : un PC Windows 11 nu suffit.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-feature=+crt-static"]
