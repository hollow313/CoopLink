[package]
name = "cooplink"
version = "1.0.0"
edition = "2021"
authors = ["Loic <loic.huon@outlook.com>"]
description = "CoopLink - High Performance Virtual LAN Gaming Overlay for Windows 11 (Cross-Platform Ready)"
license = "Proprietary"
readme = "README.md"

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29.1"
tokio = { version = "1.43", features = ["full"] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
rand = "0.8"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
clap = { version = "4.5", features = ["derive"] }
socket2 = "0.5"
crc32fast = "1.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Threading"
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
