[package]
name = "cooplink-server"
version = "1.0.0"
edition = "2021"
authors = ["Loic <loic.huon@outlook.com>"]
description = "CoopLink - Central Relay & Signaling Coordination Server with Web Admin Dashboard"
license = "Proprietary"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
chrono = "0.4"
crc32fast = "1.4"
anyhow = "1.0"
rand = "0.8"
